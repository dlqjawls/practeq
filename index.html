    <title>일단 만들어보기</title>

        min-height: 100vh; /* 화면 전체를 덮도록 설정 */
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>

      <!-- Vue 컴포넌트가 여기에 렌더링 됩니다 -->
